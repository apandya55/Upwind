name: Release checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: upwind --help
      - run: python -m pip install build
      - run: python -m build --sdist --wheel --outdir /tmp/upwind-dist
      - run: |
          python - <<'PY'
          from pathlib import Path
          from tarfile import open as open_tar
          from zipfile import ZipFile

          root = Path('/tmp/upwind-dist')
          wheel = next(root.glob('*.whl'))
          sdist = next(root.glob('*.tar.gz'))
          with ZipFile(wheel) as archive:
              names = archive.namelist()
              metadata = next(archive.read(name).decode() for name in names if name.endswith('.dist-info/METADATA'))
              assert 'License-Expression: Apache-2.0' in metadata
              assert not any('tests/' in name for name in names)
          with open_tar(sdist, 'r:gz') as archive:
              assert not any('/backend/tests/' in name for name in archive.getnames())
          PY
      - run: python -m pip install pip-audit
      - run: pip-audit -r requirements.lock -r requirements-runtime.lock
      - run: python -m pytest -q
        env:
          PYTHONPATH: backend
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
      - run: |
          python -m venv .local/runtime-api
          .local/runtime-api/bin/python -m pip install -r requirements-runtime.lock
          .local/runtime-api/bin/python -m pip install --no-deps -e .
          UPWIND_PUBLIC_READONLY=1 PYTHONPATH=backend .local/runtime-api/bin/python -c 'import sys; from upwind.api import health; assert "upwind.engine" not in sys.modules; assert health()["product"] == "national-explorer"'

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm audit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run build:vercel
        working-directory: frontend
        env:
          VITE_SITE_URL: https://upwind.example
          VITE_API_BASE_URL: https://api.upwind.example
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
        env:
          UPWIND_PYTHON: python
      - run: npm run test:e2e:public
        working-directory: frontend
        env:
          EXPECTED_PUBLIC_API_ORIGIN: https://api.upwind.example

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - run: docker compose config --quiet
      - run: docker compose -f compose.api.yaml config --quiet
        env:
          UPWIND_API_DOMAIN: api.upwind.example
          UPWIND_CORS_ORIGINS: https://upwind.example
      - run: docker compose build
        env:
          VITE_SITE_URL: https://upwind.example
          VITE_API_BASE_URL: https://api.upwind.example
