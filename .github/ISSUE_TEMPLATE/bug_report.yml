name: Bug Report
description: Report an issue, rendering defect, or data inconsistency in Upwind
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much context as possible so we can investigate and reproduce it.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating System, Browser (if frontend), and Python/Node version
      placeholder: "e.g., macOS Sequoia, Chrome 130, Python 3.12, Node 22"
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - National Explorer (Map & Place UI)
        - Local Investigation Workspace
        - Backend API / FastAPI Endpoints
        - Plume Dispersion Physics Engine
        - Data Ingestion / Build Pipeline (AQS / NEI / Census)
        - Documentation / Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Search for 'Durham, NC' in the national explorer
        2. Click on the reference monitor layer
        3. See discrepancy in...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal Logs / Browser Console
      description: Copy and paste relevant logs or stack traces if available.
      render: shell
