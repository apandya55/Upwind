name: Feature Request
description: Propose a new feature, dataset integration, or enhancement for Upwind
labels: ["enhancement", "proposal"]
body:
  - type: markdown
    attributes:
      value: |
        We appreciate feedback on new datasets, scientific methods, and user interface workflows!
  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a problem or community research need? Please describe.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you have considered.
  - type: textarea
    id: context
    attributes:
      label: Additional Context or References
      description: Links to EPA/governmental documentation, academic papers, or visual mockups.
