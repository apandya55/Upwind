services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    environment:
      UPWIND_PUBLIC_READONLY: "1"
      UPWIND_TRUST_PROXY: "1"
      UPWIND_NATIONAL_RELEASE_DIR: /data/release
      UPWIND_OSM_ROADS_DIR: /data/osm_roads/raw
      UPWIND_DATA_DIR: /tmp/upwind
    volumes:
      - ./deployment-data:/data:ro
    read_only: true
    tmpfs:
      - /tmp
    init: true
    security_opt:
      - no-new-privileges:true
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_SITE_URL: ${VITE_SITE_URL:-}
        VITE_APP_SURFACE: explorer
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    depends_on:
      api:
        condition: service_healthy
    environment:
      UPWIND_DOMAIN: ${UPWIND_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    init: true
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
